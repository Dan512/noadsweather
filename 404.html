    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Page not found — NoAdsWeather</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#111827">
    <link rel="stylesheet" href="/css/style.css">
    <script>
        // Theme + visual-style bootstrap. Runs synchronously in <head> so
        // data-theme / data-style are set BEFORE first paint — prevents the
        // white-to-dark flash on cold loads for dark-mode users.
        (function () {
            try {
                var theme = localStorage.getItem('theme') ||
                    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
                var style = localStorage.getItem('style');
                if (style && style !== 'default') {
                    document.documentElement.setAttribute('data-style', style);
                }
            } catch (e) { /* private mode — defaults apply */ }
        })();
    </script>
    <style>
        .nf-code {
            text-align: center;
            font-size: 5rem;
            font-weight: 700;
            color: var(--text-muted);
            opacity: 0.35;
            margin: 0;
            line-height: 1;
        }
        .nf-blurb {
            text-align: center;
            color: var(--text-muted);
            margin: 0.75rem 0 1.5rem;
        }
    </style>
</head>
<body>
    <div class="home-header">
        <h1><a href="/" style="text-decoration: none; color: inherit;">NoAdsWeather</a></h1>
        <p class="nf-code">404</p>
        <p class="tagline" data-i18n="notFoundTitle">Page not found</p>
    </div>
    <main class="search-container">
        <p class="nf-blurb" data-i18n="notFoundBlurb">That page doesn’t exist — but the weather does. Search for your city:</p>
        <!-- Plain GET form — the homepage reads ?q= and searches it, so this
             works with zero JavaScript. -->
        <form id="search-form" role="search" action="/" method="get">
            <div class="search-input-wrap">
                <input
                    type="text"
                    id="search-input"
                    name="q"
                    placeholder="Enter city or zip code"
                    data-i18n="searchPlaceholder"
                    data-i18n-attr="placeholder"
                    autocomplete="off"
                    required
                >
            </div>
            <button type="submit" data-i18n="searchButton">Search</button>
        </form>
        <nav class="popular-cities" aria-label="Popular cities">
            <span class="popular-cities-label" data-i18n="popularCities">Popular cities</span>
            <ul>
                <li><a href="/cities/new-york-ny/">New York</a></li>
                <li><a href="/cities/los-angeles-ca/">Los Angeles</a></li>
                <li><a href="/cities/chicago-il/">Chicago</a></li>
                <li><a href="/cities/miami-fl/">Miami</a></li>
                <li><a href="/cities/seattle-wa/">Seattle</a></li>
                <li><a href="/cities/toronto/">Toronto</a></li>
                <li><a href="/cities/london/">London</a></li>
                <li><a href="/cities/paris-en/">Paris</a></li>
                <li><a href="/cities/berlin-en/">Berlin</a></li>
                <li><a href="/cities/amsterdam-en/">Amsterdam</a></li>
                <li><a href="/cities/tokyo-en/">Tokyo</a></li>
                <li><a href="/cities/sydney/">Sydney</a></li>
            </ul>
        </nav>
        <div class="footer-links footer-links-home">
            <a href="/privacy.html" class="privacy-link" data-i18n="privacyCookies">Privacy</a>
            <a href="/about/" class="privacy-link" data-i18n="about">About</a>
            <a href="/cities/" class="privacy-link" data-i18n="cities">Cities</a>
        </div>
    </main>
    <script src="/js/i18n.js"></script>
    <script>
        // i18n: translate the data-i18n elements. Non-English visitors get
        // their language file injected (async=false, so it never blocks the
        // parser like the old document.write loader did) and are translated
        // once it arrives; English translates immediately.
        (function () {
            function translate() {
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.dataset.i18n;
                    const attr = el.dataset.i18nAttr;
                    const text = t(key);
                    if (text === key) return; // unknown key (stale i18n.js) — keep baked-in text
                    if (attr) el.setAttribute(attr, text);
                    else el.textContent = text;
                });
                document.documentElement.lang = getCurrentLang();
                document.documentElement.dir = getCurrentLang() === 'ar' ? 'rtl' : 'ltr';
            }
            var lang = getCurrentLang();
            if (lang === 'en') { translate(); return; }
            var el = document.createElement('script');
            el.src = '/js/i18n/' + lang + '.js';
            el.async = false;
            el.onload = translate;
            el.onerror = translate; // language file unavailable - English fallback
            document.head.appendChild(el);
        })();
    </script>
</body>
</html>
